[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2image"
version = "0.1.0"
description = "Generate, edit and describe images with any OpenAI-compatible image and vision model"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hamid Mergan" }]
keywords = ["image-generation", "image-editing", "vision", "text-to-image", "llm", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
test = ["pytest>=7", "fastapi>=0.110", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hamidmergan/prompt2image"
Source = "https://github.com/hamidmergan/prompt2image"
Issues = "https://github.com/hamidmergan/prompt2image/issues"
Changelog = "https://github.com/hamidmergan/prompt2image/blob/main/CHANGELOG.md"

[project.scripts]
prompt2image = "prompt2image.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt2image = ["py.typed", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
